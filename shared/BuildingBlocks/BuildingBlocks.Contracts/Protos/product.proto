syntax = "proto3";
package ecommerce.product;
option csharp_namespace = "BuildingBlocks.Contracts.Grpc.Product";

import "common.proto";

// Catalog — nguồn sự thật cho thông tin & giá sản phẩm.
service ProductGrpcService {
  rpc GetProduct (GetProductRequest) returns (ProductReply);
  // Batch lookup: Order service lấy giá nhiều dòng hàng trong 1 round-trip.
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (ProductListReply);
  rpc ValidateProducts (ValidateProductsRequest) returns (ValidateProductsReply);
}

message GetProductRequest { string id = 1; }
message GetProductsByIdsRequest { repeated string ids = 1; }

message ProductReply {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  ecommerce.common.Money price = 5;
  string category_id = 6;
  string category_name = 7;
  bool is_active = 8;
  string image_url = 9;
}

message ProductListReply { repeated ProductReply products = 1; }

message ValidateProductsRequest { repeated ValidateProductLine lines = 1; }
message ValidateProductLine { string product_id = 1; int32 quantity = 2; }

message ValidateProductsReply {
  bool is_valid = 1;
  repeated ecommerce.common.ErrorDetail errors = 2;
  repeated PricedLine priced_lines = 3;
}

message PricedLine {
  string product_id = 1;
  string sku = 2;
  string name = 3;
  int32 quantity = 4;
  ecommerce.common.Money unit_price = 5;
  ecommerce.common.Money line_total = 6;
}
