syntax = "proto3";
package ecommerce.inventory;
option csharp_namespace = "BuildingBlocks.Contracts.Grpc.Inventory";

// Tồn kho + giữ chỗ (reservation) phục vụ saga đặt hàng.
service InventoryGrpcService {
  rpc GetStock (GetStockRequest) returns (StockReply);
  rpc GetStockBatch (GetStockBatchRequest) returns (StockListReply);
  // Giữ chỗ tạm thời; hết hạn sẽ tự nhả nếu order không xác nhận.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockReply);
  // Trừ kho thật sau khi thanh toán thành công.
  rpc CommitReservation (ReservationRequest) returns (OperationReply);
  // Bồi hoàn (compensation) khi saga thất bại.
  rpc ReleaseReservation (ReservationRequest) returns (OperationReply);
}

message GetStockRequest { string product_id = 1; }
message GetStockBatchRequest { repeated string product_ids = 1; }

message StockReply {
  string product_id = 1;
  string sku = 2;
  int32 quantity_on_hand = 3;
  int32 quantity_reserved = 4;
  int32 quantity_available = 5;
  int32 reorder_level = 6;
  bool is_low_stock = 7;
  string warehouse_code = 8;
}

message StockListReply { repeated StockReply items = 1; }

message ReserveStockRequest {
  string order_id = 1;
  repeated ReserveLine lines = 2;
  int32 ttl_seconds = 3;
}

message ReserveLine { string product_id = 1; int32 quantity = 2; }

message ReserveStockReply {
  bool success = 1;
  string reservation_id = 2;
  repeated InsufficientItem insufficient = 3;
  string message = 4;
}

message InsufficientItem {
  string product_id = 1;
  int32 requested = 2;
  int32 available = 3;
}

message ReservationRequest { string order_id = 1; string reservation_id = 2; }
message OperationReply { bool success = 1; string message = 2; }
