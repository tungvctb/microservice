syntax = "proto3";
package ecommerce.notification;
option csharp_namespace = "BuildingBlocks.Contracts.Grpc.Notification";

// Đẩy thông báo realtime; service khác có thể gọi trực tiếp thay vì qua broker khi cần tức thì.
service NotificationGrpcService {
  rpc PushToUser (PushToUserRequest) returns (PushReply);
  rpc Broadcast (BroadcastRequest) returns (PushReply);
  rpc GetUnreadCount (GetUnreadCountRequest) returns (UnreadCountReply);
}

message PushToUserRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  string severity = 4;          // Info | Success | Warning | Error
  string link = 5;
  map<string, string> metadata = 6;
}

message BroadcastRequest {
  string title = 1;
  string body = 2;
  string severity = 3;
  string channel = 4;
}

message PushReply { bool delivered = 1; string notification_id = 2; }
message GetUnreadCountRequest { string user_id = 1; }
message UnreadCountReply { int32 count = 1; }
